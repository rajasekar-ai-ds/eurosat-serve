name: CI


on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check SAS Token
        env:
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        run: | 
          if [ -z "$AZURE_SAS_TOKEN" ]; then
            echo "::error::AZURE_SAS_TOKEN is empty"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache venv
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: v1-venv-${{ runner.os }}-py${{ steps.py.outputs.python-version}}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}



      - name: Install Dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Set GITHUB_PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check step
        run: |
          which python
          which dvc

      - name: Configure DVC credential
        env:
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        run: dvc remote modify --local azremote sas_token "$AZURE_SAS_TOKEN"

      - name: Download the weights from Azure
        run: dvc pull

      - name: Run Tests
        run: pytest -v



